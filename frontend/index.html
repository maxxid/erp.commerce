<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="/app/manifest.json">
    <link rel="apple-touch-icon" href="/app/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/app/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/app/icons/icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ApexERP">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ApexERP</title>
    <script>
      (function() {
        const saved = localStorage.getItem('apex-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = saved ? saved === 'dark' : prefersDark;
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="app" v-cloak></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/app/sw.js').catch(() => {})
        })
      }
    </script>
</body>
</html>
